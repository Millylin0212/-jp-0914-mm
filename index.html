<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>東京＋箱根 6天5夜｜行動手冊</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#E7EBE6;
  --card:#FFFFFF;
  --ink:#12293B;
  --ink2:#4E6274;
  --ink3:#8496A3;
  --rule:#D2D8D1;
  --board:#12293B;
  --signal:#F2C230;
  --jr:#9ACD32;
  --keisei:#1B3A73;
  --odakyu:#E8542F;
  --tozan:#E5002D;
  --bus:#F0803C;
  --ship:#1E7A8C;
  --rope:#7A5BA6;
  --cable:#2E8B57;
  --asakusa:#E9546B;
  --ikegami:#EE86A7;
  --walk:#8496A3;
  --num:"Barlow Condensed","Helvetica Neue",Arial,sans-serif;
  --sans:"Hiragino Sans","PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper);color:var(--ink);font-family:var(--sans);
  font-size:16px;line-height:1.65;-webkit-text-size-adjust:100%;
}
.wrap{max-width:480px;margin:0 auto;padding:0 14px 96px}
.num{font-family:var(--num);font-variant-numeric:tabular-nums;letter-spacing:.01em}

/* ── 頁首 ───────────────────────── */
header{position:sticky;top:0;z-index:40;background:var(--paper);
  border-bottom:1px solid var(--rule);padding-top:env(safe-area-inset-top)}
.head-in{max-width:480px;margin:0 auto;padding:10px 14px 0}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.brand h1{font-size:15px;margin:0;font-weight:700;letter-spacing:.02em}
.brand .range{font-family:var(--num);font-size:14px;color:var(--ink2);font-weight:500}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:9px 0 0;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;background:transparent;border:1px solid var(--rule);border-radius:9px;
  padding:5px 9px 6px;text-align:center;cursor:pointer;color:var(--ink2);
  border-bottom-width:3px;font-family:inherit}
.tab b{display:block;font-family:var(--num);font-size:17px;font-weight:600;line-height:1;color:var(--ink)}
.tab span{display:block;font-family:var(--num);font-size:12px;line-height:1.4;letter-spacing:.02em}
.tab[aria-selected="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 0 rgba(18,41,59,.08)}
.tab.tokyo[aria-selected="true"]{border-bottom-color:var(--jr)}
.tab.hakone[aria-selected="true"]{border-bottom-color:var(--tozan)}
.tab.today::after{content:"今天";display:block;font-size:10px;color:var(--odakyu);line-height:1.3}

/* ── 現在／下一站 ───────────────── */
.board{background:var(--board);color:#fff;border-radius:14px;margin:14px 0 16px;overflow:hidden}
.board-top{display:flex;justify-content:space-between;align-items:center;
  padding:11px 14px;border-bottom:1px solid rgba(255,255,255,.16)}
.board-top .now{font-family:var(--num);font-size:14px;color:#C6D2DC;letter-spacing:.04em}
.board-top .clock{font-family:var(--num);font-size:22px;font-weight:600;line-height:1}
.board-body{padding:13px 14px 15px}
.board-body .lbl{font-size:12px;color:#9FB2C0;margin-bottom:3px}
.board-body .ttl{font-size:19px;font-weight:700;line-height:1.35;margin:0 0 2px}
.board-body .sub{font-size:13px;color:#C6D2DC;margin:0}
.board-body .at{font-family:var(--num);font-size:15px;color:var(--signal);font-weight:600}
.bigmap{display:block;margin-top:12px;background:var(--signal);color:#12293B;
  text-align:center;font-weight:700;font-size:16px;padding:13px;border-radius:10px;text-decoration:none}
.bigmap:active{background:#DBAE24}
button.bigmap{width:100%;border:none;font-family:inherit;cursor:pointer}
.rawurl{font-size:12px;line-height:1.5;word-break:break-all;color:var(--ink2);
  margin-top:7px;user-select:all;-webkit-user-select:all;flex-basis:100%}
.fixed .rawurl{color:#C6D2DC}

/* ── 日摘要 ─────────────────────── */
.dayhead{margin:0 0 14px}
.dayhead .dl{font-family:var(--num);font-size:13px;color:var(--ink2);letter-spacing:.04em}
.dayhead h2{font-size:22px;margin:1px 0 6px;line-height:1.35}
.dayhead p{margin:0;font-size:14px;color:var(--ink2)}

/* ── 卡片與時間軸 ───────────────── */
.card{background:var(--card);border-radius:12px;padding:13px 14px;margin-bottom:10px;
  border:1px solid var(--rule)}
.fixed{background:var(--board);border-color:var(--board);color:#fff;position:relative;
  padding-left:18px}
.fixed::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:5px;
  background:var(--signal);border-radius:0 4px 4px 0}
.fixed .t,.fixed h3{color:#fff}
.fixed .meta{color:#C6D2DC}
.row{display:flex;gap:11px}
.t{font-family:var(--num);font-size:19px;font-weight:600;line-height:1.25;
  flex:0 0 62px;color:var(--ink);padding-top:1px}
.t.soft{color:var(--ink3);font-weight:500}
.body{flex:1;min-width:0}
h3{font-size:16.5px;margin:0 0 3px;line-height:1.4;font-weight:700}
.meta{font-size:13.5px;color:var(--ink2);margin:0 0 2px}
ul.pts{margin:6px 0 0;padding-left:17px;font-size:13.5px;color:var(--ink2)}
ul.pts li{margin-bottom:2px}
.chip{display:inline-block;font-size:11.5px;line-height:1;padding:4px 7px;border-radius:5px;
  margin:0 0 0 6px;vertical-align:2px;font-weight:700;white-space:nowrap}
.c-must{background:var(--board);color:#fff}
.c-booked{background:var(--signal);color:#12293B}
.c-rec{background:#fff;color:var(--board);border:1px solid var(--board)}
.c-alt{background:#fff;color:var(--ink3);border:1px solid var(--rule)}
.c-drop{background:#fff;color:var(--ink3);border:1px dashed var(--ink3)}
.fixed .c-rec{background:transparent;color:#fff;border-color:#fff}

/* 交通路線圖 */
.route{margin:9px 0 4px;padding:2px 0 0}
.stn{display:flex;align-items:center;gap:9px;font-size:14px;font-weight:600}
.stn i{width:11px;height:11px;border-radius:50%;border:3px solid var(--ink);
  background:var(--card);flex:0 0 11px;font-style:normal}
.leg{display:flex;align-items:center;gap:9px;min-height:30px}
.leg .bar{width:11px;flex:0 0 11px;align-self:stretch;display:flex;justify-content:center}
.leg .bar em{width:5px;background:var(--walk);display:block;border-radius:3px}
.leg .lname{font-size:13px;color:var(--ink2);padding:4px 0}
.leg .mins{font-family:var(--num);font-size:13px;color:var(--ink3);margin-left:4px}
.fixed .stn i{border-color:#fff;background:var(--board)}
.fixed .leg .lname{color:#C6D2DC}

/* 按鈕 */
.acts{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.btn{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:600;
  text-decoration:none;color:var(--board);background:#EEF2F4;border:1px solid var(--rule);
  border-radius:8px;padding:8px 11px;cursor:pointer;font-family:inherit}
.btn:active{background:#DDE5E9}
.btn.map{background:var(--board);color:#fff;border-color:var(--board)}
.fixed .btn{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.3)}
.disc{margin-top:9px}
.disc summary{font-size:13.5px;color:var(--ink2);cursor:pointer;list-style:none;
  display:inline-flex;align-items:center;gap:5px;font-weight:600}
.disc summary::-webkit-details-marker{display:none}
.disc summary::before{content:"＋";font-family:var(--num);font-weight:600}
.disc[open] summary::before{content:"－"}
.disc .in{font-size:13.5px;color:var(--ink2);padding-top:5px;border-top:1px solid var(--rule);margin-top:7px}
.fixed .disc .in{border-color:rgba(255,255,255,.2);color:#C6D2DC}
.warn{background:#FFF6DC;border:1px solid #ECD79A;border-radius:9px;padding:9px 11px;
  font-size:13.5px;color:#5C4A11;margin-top:9px}
.skip{font-size:13.5px;color:var(--ink2)}
.skip b{color:var(--ink)}

/* 勾選 */
.chk{appearance:none;width:22px;height:22px;border:2px solid var(--ink3);border-radius:6px;
  flex:0 0 22px;margin:2px 0 0;cursor:pointer;background:var(--card);position:relative}
.chk:checked{background:var(--board);border-color:var(--board)}
.chk:checked::after{content:"";position:absolute;left:6px;top:2px;width:6px;height:12px;
  border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(42deg)}
.done h3,.done .meta{opacity:.42;text-decoration:line-through}
.done .route,.done .acts{opacity:.5}

/* 區塊標題 */
.sect{margin:26px 0 9px;display:flex;align-items:baseline;justify-content:space-between}
.sect h4{font-size:14px;margin:0;letter-spacing:.03em}
.sect span{font-size:12.5px;color:var(--ink3)}
.list label{display:flex;gap:11px;align-items:flex-start;padding:9px 0;
  border-bottom:1px solid var(--rule);font-size:14.5px;cursor:pointer}
.list label:last-child{border-bottom:none}
.list .txt small{display:block;font-size:12.5px;color:var(--ink3);line-height:1.5}
.list input:checked+.txt{opacity:.45;text-decoration:line-through}

/* 底部導航 */
nav.bot{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--card);
  border-top:1px solid var(--rule);padding-bottom:env(safe-area-inset-bottom)}
nav.bot div{max-width:480px;margin:0 auto;display:flex}
nav.bot button{flex:1;background:none;border:none;padding:10px 2px 11px;font-family:inherit;
  font-size:11.5px;color:var(--ink3);cursor:pointer;font-weight:600;white-space:nowrap}
nav.bot button[aria-current="true"]{color:var(--board);box-shadow:inset 0 3px 0 var(--board)}
.toast{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);background:var(--board);
  color:#fff;font-size:14px;padding:9px 16px;border-radius:20px;opacity:0;pointer-events:none;
  transition:opacity .18s;z-index:60}
.toast.on{opacity:1}
.pgrow{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;font-size:15px}
.pgrow .num{font-size:17px;font-weight:600}
.prog{height:9px;background:#DDE3DD;border-radius:5px;overflow:hidden}
.prog em{display:block;height:100%;background:var(--board);border-radius:5px;transition:width .25s}
.seg{display:flex;gap:7px;margin:0 0 12px}
.sgb{flex:1;padding:9px;border-radius:9px;border:1px solid var(--rule);background:var(--card);
  font-family:inherit;font-size:13.5px;font-weight:600;color:var(--ink2);cursor:pointer}
.sgb.on{background:var(--board);color:#fff;border-color:var(--board)}
details.sec{background:var(--card);border:1px solid var(--rule);border-radius:12px;
  margin-bottom:9px;overflow:hidden}
details.sec>summary{padding:12px 14px;font-size:15px;font-weight:700;cursor:pointer;
  display:flex;justify-content:space-between;align-items:center;gap:10px;list-style:none}
details.sec>summary::-webkit-details-marker{display:none}
details.sec .cnt{font-size:13px;color:var(--ink3);font-weight:500;white-space:nowrap}
details.sec .in{padding:0 14px 6px}
.subh{font-size:12.5px;font-weight:700;color:var(--ink3);letter-spacing:.04em;
  padding:11px 0 3px;border-top:1px solid var(--rule);margin-top:4px}
.list label:first-child .subh{border-top:none}
.notep{font-size:12.5px;line-height:1.6;color:var(--ink2);background:#F1F4F1;
  border-radius:8px;padding:8px 10px;margin:9px 0 2px}
.pri{width:9px;height:9px;border-radius:50%;flex:0 0 9px;margin-top:8px}
.p1{background:#D93025}.p2{background:var(--signal)}.p3{background:#C8D0D4}
label.hide{display:none}
:focus-visible{outline:3px solid var(--odakyu);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header>
  <div class="head-in">
    <div class="brand">
      <h1>東京＋箱根 6天5夜</h1>
      <span class="range num">9/14 – 9/19</span>
    </div>
    <div class="tabs" id="tabs" role="tablist"></div>
  </div>
</header>

<div class="wrap">
  <div id="view"></div>
</div>

<nav class="bot"><div>
  <button data-view="day" aria-current="true">每日行程</button>
  <button data-view="prep">出發準備</button>
  <button data-view="times">時間表</button>
  <button data-view="shop">伴手禮</button>
  <button data-view="info">資訊</button>
</div></nav>
<div class="toast" id="toast"></div>

<script>
/* ══════════════════════════════════════════════════════════

};

const DAYS = [

let onlyTodo = false;
const prepKey = (s,i) => "pp"+s+"-"+i;
function prepStats(){
  let done=0, all=0, redLeft=0;
  PREP.forEach((s,si)=>s.i.forEach((it,ii)=>{
    if(!Array.isArray(it)) return;
    all++;
    if(checks[prepKey(si,ii)]) done++; else if(it[1]===1) redLeft++;
  }));
  return {done, all, redLeft, pct: all? Math.round(done/all*100):0};
}
function secStats(si){
  let d=0,a=0;
  PREP[si].i.forEach((it,ii)=>{ if(!Array.isArray(it)) return; a++; if(checks[prepKey(si,ii)]) d++; });
  return d+" / "+a;
}
function prepHTML(){
  const st = prepStats();
  let h = '<div class="dayhead"><h2>出發準備</h2><p>勾選存在這台裝置，重新整理或重新部署都不會消失。</p></div>';
  h += '<div class="card"><div class="pgrow"><b class="num" id="pptxt">已完成 '+st.done+' / '+st.all+'</b>'+
       '<span class="num" id="pppct">'+st.pct+'%</span></div>'+
       '<div class="prog"><em id="ppbar" style="width:'+st.pct+'%"></em></div>'+
       '<p class="meta" id="ppred" style="margin-top:8px">🔴 必須完成還剩 '+st.redLeft+' 項</p></div>';
  h += '<div class="seg"><button class="sgb'+(onlyTodo?"":" on")+'" data-todo="0">全部</button>'+
       '<button class="sgb'+(onlyTodo?" on":"")+'" data-todo="1">只看未完成</button></div>';
  h += PREP.map((s,si)=>{
    let inner = "";
    s.i.forEach((it,ii)=>{
      if(it.sub){ inner += '<div class="subh">'+esc(it.sub)+'</div>'; return; }
      if(it.note){ inner += '<div class="notep">'+esc(it.note)+'</div>'; return; }
      const k = prepKey(si,ii), on = !!checks[k];
      inner += '<label class="'+(onlyTodo&&on?"hide":"")+'" data-pp="1">'+
        '<input class="chk" type="checkbox" data-k="'+k+'" '+(on?"checked":"")+'>'+
        '<span class="pri p'+it[1]+'"></span><span class="txt">'+esc(it[0])+'</span></label>';
    });
    return '<details class="sec"'+(si<2?" open":"")+'><summary>'+esc(s.t)+
      '<span class="cnt num" data-sec="'+si+'">'+secStats(si)+'</span></summary>'+
      '<div class="in list">'+inner+'</div></details>';
  }).join("");
  h += '<div class="card"><p class="meta">🔴 必須完成　🟡 建議完成　⚪ 選擇性</p></div>';
  return h;
}
function prepCardHTML(){
  const st = prepStats();
  return '<div class="card" id="ppcard"><div class="pgrow"><b>日本旅行準備進度</b>'+
    '<span class="num">'+st.pct+'%</span></div><div class="prog"><em style="width:'+st.pct+'%"></em></div>'+
    '<p class="meta" style="margin:7px 0 0">已完成 '+st.done+' / '+st.all+'　🔴 還剩 '+st.redLeft+' 項</p>'+
    '<div class="acts"><button class="btn" data-go="prep">查看未完成事項</button></div></div>';
}
function refreshPrep(){
  const st = prepStats();
  const a=document.getElementById("pptxt"), b=document.getElementById("ppbar"),
        c=document.getElementById("pppct"), d=document.getElementById("ppred");
  if(a) a.textContent = "已完成 "+st.done+" / "+st.all;
  if(b) b.style.width = st.pct+"%";
  if(c) c.textContent = st.pct+"%";
  if(d) d.textContent = "🔴 必須完成還剩 "+st.redLeft+" 項";
  document.querySelectorAll("[data-sec]").forEach(e=>e.textContent = secStats(+e.dataset.sec));
}
const VERSION = "v6・2026-09-06";
const CH = {"必去":"c-must","已訂":"c-booked","建議":"c-rec","候補":"c-alt","可取消":"c-drop"};
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let checks = {}, curDay = 1, curView = "day";

/* 儲存：優先用 artifact storage，失敗則僅存於本次開啟 */
async function load(){
  try{ const r = await window.storage.get("trip-checks"); if(r&&r.value){ checks = JSON.parse(r.value); return; } }catch(e){}
  try{ const s = localStorage.getItem("trip-checks"); if(s) checks = JSON.parse(s); }catch(e){}
}
let saveTimer;
function save(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async ()=>{
    try{ localStorage.setItem("trip-checks", JSON.stringify(checks)); }catch(e){}
    try{ await window.storage.set("trip-checks", JSON.stringify(checks)); }catch(e){}
  }, 400);
}
function jstNow(){
  const d = new Date();
  return new Date(d.getTime() + (d.getTimezoneOffset()+540)*60000);
}
function todayId(){
  const s = jstNow().toISOString().slice(0,10);
  const d = DAYS.find(x=>x.date===s);
  return d ? d.id : null;
}

    if(x.s) return '<div class="stn"><i></i>'+esc(x.s)+'</div>';
    const L = LINE[x.l];
    return '<div class="leg"><span class="bar"><em style="background:'+L.c+'"></em></span>'+
      '<span class="lname">'+esc(L.n)+(x.note?'（'+esc(x.note)+'）':'')+
      (x.mins?'<span class="mins">'+esc(x.mins)+'</span>':'')+'</span></div>';
  }).join("") + '</div>';
}
function mapBtn(m, cls){ return '<button class="btn '+(cls||"map")+'" data-url="'+m.u+'">開啟 Google Maps・'+esc(m.n)+'</button>'; }

/* 沙箱環境可能擋掉分頁開啟，逐層降級：新分頁 → 直接跳轉 → 複製連結 */
function openLink(url, el){
  let w = null;
  try{ w = window.open(url, "_blank", "noopener"); }catch(e){}
  if(w) return;
  try{ window.top.location.href = url; return; }catch(e){}
  try{ window.location.href = url; return; }catch(e){}
  navigator.clipboard.writeText(url).then(()=>toast("連結已複製，請貼到瀏覽器")).catch(()=>toast("請長按下方連結開啟"));
  if(el && !el.nextElementSibling?.classList.contains("rawurl")){
    const d = document.createElement("div");
    d.className = "rawurl"; d.textContent = url;
    el.parentNode.insertBefore(d, el.nextSibling);
  }
}

function itemHTML(it, di, i){
  const k = "d"+di+"-"+i, done = !!checks[k];
  let h = '<article class="card'+(it.fixed?" fixed":"")+(done?" done":"")+'" id="'+k+'"><div class="row">';
  h += '<input class="chk" type="checkbox" data-k="'+k+'" '+(done?"checked":"")+' aria-label="完成 '+esc(it.title)+'">';
  h += '<div class="t'+(it.soft?" soft":"")+' num">'+esc(it.time)+'</div><div class="body">';
  h += '<h3>'+esc(it.title)+(it.status?'<span class="chip '+CH[it.status]+'">'+it.status+'</span>':'')+'</h3>';
  if(it.meta) h += '<p class="meta">'+esc(it.meta)+'</p>';
  if(it.route) h += routeHTML(it.route);
  if(it.pts && it.pts.length) h += '<ul class="pts">'+it.pts.map(p=>'<li>'+esc(p)+'</li>').join("")+'</ul>';
  if(it.warn) h += '<div class="warn">'+esc(it.warn)+'</div>';
  const acts = [];
  if(it.map) acts.push(mapBtn(it.map));
  if(it.map2) acts.push(mapBtn(it.map2,"map"));
  if(it.addr) acts.push('<button class="btn copy" data-copy="'+esc(it.addr)+'">複製地址</button>');
  if(acts.length) h += '<div class="acts">'+acts.join("")+'</div>';
  h += '</div></div></article>';
  return h;
}

function nextItem(d){
  const isToday = todayId()===d.id;
  if(!isToday) return d.items.find(x=>x.fixed) || d.items[0];
  const n = jstNow(), hm = String(n.getHours()).padStart(2,"0")+":"+String(n.getMinutes()).padStart(2,"0");
  return d.items.find((x,i)=>x.t>=hm && !checks["d"+d.id+"-"+i]) || d.items[d.items.length-1];
}

function boardHTML(d){
  const it = nextItem(d), isToday = todayId()===d.id;
  const n = jstNow(), clock = String(n.getHours()).padStart(2,"0")+":"+String(n.getMinutes()).padStart(2,"0");
  let h = '<section class="board"><div class="board-top"><span class="now num">'+
    (isToday? "日本時間 · 今天":"日本時間 · 預覽 Day "+d.id)+'</span><span class="clock num">'+clock+'</span></div>';
  h += '<div class="board-body"><div class="lbl">'+(isToday?"下一站":"這天的第一個控制點")+'</div>';
  h += '<h2 class="ttl">'+esc(it.title)+'</h2>';
  h += '<p class="sub"><span class="at num">'+esc(it.time)+'</span>'+(it.meta?'　'+esc(it.meta):'')+'</p>';
  const m = it.map || (d.items.find(x=>x.map)||{}).map;
  if(m) h += '<button class="bigmap" data-url="'+m.u+'">開啟 Google Maps・'+esc(m.n)+'</button>';
  h += '</div></section>';
  return h;
}

function dayHTML(d){
  let h = boardHTML(d);
  if(prepStats().done < prepStats().all) h += prepCardHTML();
  h += '<div class="dayhead"><div class="dl num">DAY '+d.id+' ・ '+d.date.slice(5).replace("-","/")+'（'+d.dow+'）</div>'+
       '<h2>'+esc(d.title)+'</h2><p>'+esc(d.lede)+'</p></div>';
  h += d.items.map((it,i)=>itemHTML(it,d.id,i)).join("");
  if(d.skip) h += '<div class="card"><p class="skip"><b>今天不安排：</b>'+d.skip.map(esc).join("、")+'</p></div>';
  return h;
}

function timesHTML(){
  let h = '<div class="dayhead"><h2>現場必看時間</h2><p>只有這幾個時間點不能動，其他都可以依體力調整。</p></div>';

    '</div><div class="body"><h3>'+esc(c.t)+'</h3><p class="meta">'+esc(c.r)+'</p></div></div></article>').join("");

    ["9/15 13:00 Romancecar 已購票","9/15 抵達新宿不得晚於 12:00","不加阿美橫丁","9/18 不排斉藤湯（週五公休）",
     "不加需要大幅繞路的新景點","未確認班次不寫成已確定"].map(x=>'<li>'+x+'</li>').join("")+'</ul></div>';
  return h;
}

function shopHTML(){
  let h = '<div class="dayhead"><h2>伴手禮清單</h2><p>不用全買。9/18 是主力採買日，櫃位與有無現貨當天再確認。</p></div>';
  h += '<div class="card list">'+SOUVENIR.map((s,i)=>{
    const k="sv"+i;
    return '<label><input class="chk" type="checkbox" data-k="'+k+'" '+(checks[k]?"checked":"")+
      '><span class="txt">'+esc(s.n)+'<small>'+esc(s.w)+'</small></span></label>';
  }).join("")+'</div>';
  h += '<div class="sect"><h4>出發前要確認的事</h4><span>'+PENDING.length+' 項</span></div>';
  h += '<div class="card list">'+PENDING.map((p,i)=>{
    const k="pd"+i;
    return '<label><input class="chk" type="checkbox" data-k="'+k+'" '+(checks[k]?"checked":"")+
      '><span class="txt">'+esc(p)+'</span></label>';
  }).join("")+'</div>';
  return h;
}

function infoHTML(){
  let h = '<div class="dayhead"><h2>住宿・票券・店家</h2><p>地址可一鍵複製，直接貼給計程車或 Google Maps。</p></div>';
  [HOTEL_TOKYO,HOTEL_HAKONE].forEach(x=>{
    h += '<article class="card"><h3>'+esc(x.name)+'</h3><p class="meta">'+esc(x.addr)+'</p>'+
      '<p class="meta">'+esc(x.note)+'</p><div class="acts">'+mapBtn({n:"導航",u:x.map})+
      '<button class="btn copy" data-copy="'+esc(x.addr)+'">複製地址</button></div></article>';
  });
  h += '<div class="sect"><h4>票券備忘</h4></div><div class="card"><ul class="pts">'+
    ["去程 9/15 箱根 9 號 (MSE6)｜新宿 13:00 → 箱根湯本 14:30｜4 號車廂 2A・2B｜E272",
     "回程 9/17 箱根 14 號 (EXE6)｜箱根湯本 15:52 → 新宿 17:27｜2 號車廂 2A・2B｜E464",
     "兩張都是 EMot 電子特急券：不用取票，上車前登入顯示票面即可",
     "特急券只是加價券，另需乘車券——由箱根周遊券涵蓋",
     "箱根周遊券（KKday・3 日券・成人 x2）：9/15 於新宿西口小田急旅遊服務中心換實體票，效期 9/15–9/17",
     "Skyliner 去程＋回程（KLOOK）：憑證需換實體票，成田 T2 服務中心 07:00–23:30，21:00 後改櫃檯",
     "日暮里站也可兌換 Skyliner（售票機／JR 換乘檢票口）05:00–23:30",
     "9/19 回程 Skyliner 首選 16:25，備案 15:45",
     "護照、KKday 憑證、EMot 票面建議離線存手機；手機要有電"].map(x=>'<li>'+x+'</li>').join("")+'</ul></div>';
  h += '<div class="sect"><h4>朋友推薦店家</h4></div>';
  h += PICKS.map(p=>'<article class="card"><h3>'+esc(p.n)+'</h3><p class="meta">'+esc(p.u)+'</p>'+
    '<p class="meta">'+esc(p.d)+'</p>'+(p.a?'<p class="meta">'+esc(p.a)+'</p>':'')+
    '<div class="acts"><button class="btn map" data-url="'+p.m+'">開啟連結</button>'+
    (p.a?'<button class="btn copy" data-copy="'+esc(p.a)+'">複製地址</button>':'')+'</div></article>').join("");

     "飯店地址用上方「複製地址」直接出示","走散時約定回合點：當日住宿飯店大廳"].map(x=>'<li>'+x+'</li>').join("")+'</ul></div>';

function renderTabs(){
  const tid = todayId();
  document.getElementById("tabs").innerHTML = DAYS.map(d=>
    '<button class="tab '+d.area+(tid===d.id?" today":"")+'" role="tab" data-day="'+d.id+
    '" aria-selected="'+(curDay===d.id&&curView==="day")+'"><b>'+d.id+'</b><span>'+
    d.date.slice(5).replace("-","/")+'</span></button>').join("");
}
function render(){
  renderTabs();
  const v = document.getElementById("view");
  v.innerHTML = curView==="day" ? dayHTML(DAYS.find(d=>d.id===curDay))
    : curView==="prep" ? prepHTML()
    : curView==="times" ? timesHTML() : curView==="shop" ? shopHTML() : infoHTML();
  document.querySelectorAll("nav.bot button").forEach(b=>
    b.setAttribute("aria-current", b.dataset.view===curView));
  window.scrollTo(0,0);
}

document.addEventListener("click", e=>{
  const tab = e.target.closest(".tab");
  if(tab){ curDay = +tab.dataset.day; curView = "day"; render(); return; }
  const nav = e.target.closest("nav.bot button");
  if(nav){ curView = nav.dataset.view; render(); return; }
  const go = e.target.closest("[data-go]");
  if(go){ curView = go.dataset.go; onlyTodo = true; render(); return; }
  const sg = e.target.closest(".sgb");
  if(sg){ onlyTodo = sg.dataset.todo==="1"; render(); return; }
  const lk = e.target.closest("[data-url]");
  if(lk){ openLink(lk.dataset.url, lk); return; }
  const cp = e.target.closest(".copy");
  if(cp){ navigator.clipboard.writeText(cp.dataset.copy).then(()=>toast("地址已複製")).catch(()=>toast("複製失敗，請長按選取")); return; }
});
document.addEventListener("change", e=>{
  const c = e.target.closest(".chk");
  if(!c) return;
  checks[c.dataset.k] = c.checked; save();
  const card = c.closest(".card");
  if(card) card.classList.toggle("done", c.checked);
  if(c.dataset.k.indexOf("pp")===0){
    refreshPrep();
    const lb = c.closest("label[data-pp]");
    if(lb && onlyTodo && c.checked) setTimeout(()=>lb.classList.add("hide"), 280);
  }
});

(async function init(){
  await load();
  let seeded = false;
  PREP.forEach((s,si)=>s.i.forEach((it,ii)=>{
    if(Array.isArray(it) && it[2] && checks[prepKey(si,ii)]===undefined){
      checks[prepKey(si,ii)] = true; seeded = true;
    }
  }));
  if(seeded) save();
  const t = todayId(); if(t) curDay = t;
  render();
  setInterval(()=>{ if(curView==="day"){ const b=document.querySelector(".board"); if(b) b.outerHTML = boardHTML(DAYS.find(d=>d.id===curDay)); } }, 60000);
})();
</script>
